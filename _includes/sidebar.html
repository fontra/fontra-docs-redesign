<aside class="sidebar">
  {%- for group in nav.side %}
  <div class="navgroup"><div class="lbl">{{ group.label }}</div><nav class="nav" aria-label="{{ group.label }}">
    {%- for item in group.items %}
    {%- assign st = collections.docsStatus[item.href] %}
    <a href="{{ item.href }}" class="{% if item.id == active %}on{% endif %}{% if st == "planned" %} planned{% endif %}"{% if item.id == active %} aria-current="page"{% endif %}>{{ item.label }}{% if st == "planned" %} <span class="status planned" title="Planned: not written yet">Planned</span>{% endif %}</a>
    {%- endfor %}
  </nav></div>
  {%- endfor %}
  <div class="sidefoot"><a href="about.html#status">Still to write: the pages marked Planned</a></div>
</aside>
